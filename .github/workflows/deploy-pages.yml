name: Deploy VITRUS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NEXT_PUBLIC_SITE_URL: https://vitrus.org
      - name: Preserve recent static assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/vitrus-pages-assets out/_next/static
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "Deploy VITRUS to GitHub Pages" \
            --status success \
            --limit 5 \
            --json databaseId \
            --jq '.[].databaseId' | while read -r run_id; do
              artifact_dir="/tmp/vitrus-pages-assets/${run_id}"
              mkdir -p "${artifact_dir}/site"
              gh run download "${run_id}" \
                --repo "${{ github.repository }}" \
                --name github-pages \
                --dir "${artifact_dir}" || continue
              if [ -f "${artifact_dir}/artifact.tar" ]; then
                tar -xf "${artifact_dir}/artifact.tar" -C "${artifact_dir}/site"
                if [ -d "${artifact_dir}/site/_next/static" ]; then
                  rsync -a --ignore-existing "${artifact_dir}/site/_next/static/" out/_next/static/
                fi
              fi
            done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
